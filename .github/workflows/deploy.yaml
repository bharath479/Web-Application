name: Deploy Cloud Run Infra and App

on:
  push:
    branches:
      - Infra

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
  IMAGE_TAG: ${{ secrets.IMAGE_TAG }}

jobs:
  terraform-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker $REGION-docker.pkg.dev

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./
        run: terraform init

      - name: Terraform Validate
        working-directory: ./
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ secrets.GCP_REGION }}
          TF_VAR_credentials: ${{ secrets.GCP_SA_KEY }}
          TF_VAR_image: "us-central1-docker.pkg.dev/glass-ally-479415-q8/docker-repo/sample-webapp@sha256:7e4aabcecdf6d3cae4064d58d93ca40c4299721e23f492c9bc0cd6afc1ca13aa"
          TF_VAR_service_account_email: "github-actions-sa@glass-ally-479415-q8.iam.gserviceaccount.com"
          TF_VAR_service_name: "my-cloud-run-service"
        run: terraform plan -out=tfplan
        

      - name: Terraform Apply
        working-directory: ./
        run: terraform apply -auto-approve tfplan

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $IMAGE_NAME \
            --image=$REGION-docker.pkg.dev/$PROJECT_ID/$IMAGE_NAME/$IMAGE_NAME:$IMAGE_TAG \
            --region=$REGION \
            --platform=managed \
            --allow-unauthenticated
